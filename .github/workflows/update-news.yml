name: Update projector news

on:
  schedule:
    # GitHub Actions cron uses UTC. This runs at 09:00 Asia/Taipei.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projector-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect projector news
        run: python news_collector.py --days 7 --max-items 1000 --retention-days 370

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          if git diff --cached --quiet; then
            echo "No news_data.json changes to commit."
          else
            git commit -m "Update projector news data"
            git push
          fi
